<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIlourOS</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1019;
        color: #f5f0e7;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #ailouros-bootstrap {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0f1019;
        z-index: 99999;
        transition: opacity 220ms ease;
      }
      #ailouros-bootstrap[data-hidden="1"] {
        opacity: 0;
        pointer-events: none;
      }
      .ab-logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #f4c15d, #d97706);
        box-shadow:
          0 0 0 1px rgba(244, 193, 93, 0.18),
          0 12px 36px rgba(244, 193, 93, 0.18);
      }
      .ab-title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #a8b0c4;
      }
      .ab-message {
        font-size: 13px;
        color: #6b7280;
        min-height: 1.2em;
        text-align: center;
        padding: 0 24px;
      }
      .ab-spinner {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(244, 193, 93, 0.2);
        border-top-color: #f4c15d;
        animation: ab-spin 0.9s linear infinite;
      }
      @keyframes ab-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ailouros-bootstrap" role="status" aria-live="polite">
      <div class="ab-logo" aria-hidden="true"></div>
      <div class="ab-title">AIlourOS</div>
      <div id="ailouros-bootstrap-message" class="ab-message">Starting…</div>
      <div class="ab-spinner" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIlourOS</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f3ece0;
        color: #1a1612;
        font-family:
          "Geist",
          "Space Grotesk",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #15120e;
        color: #f3ece0;
      }
      #ailouros-bootstrap {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f3ece0;
        z-index: 99999;
        transition: opacity 220ms ease;
      }
      html[data-theme="dark"] #ailouros-bootstrap {
        background: #15120e;
      }
      #ailouros-bootstrap[data-hidden="1"] {
        opacity: 0;
        pointer-events: none;
      }
      .ab-logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #e16a3a, #c84f1f);
        box-shadow:
          0 0 0 1px rgba(225, 106, 58, 0.22),
          0 12px 36px rgba(225, 106, 58, 0.22);
      }
      .ab-title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6a5d4d;
      }
      html[data-theme="dark"] .ab-title {
        color: #a89a86;
      }
      .ab-message {
        font-size: 13px;
        color: #98897a;
        min-height: 1.2em;
        text-align: center;
        padding: 0 24px;
      }
      .ab-spinner {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(225, 106, 58, 0.22);
        border-top-color: #e16a3a;
        animation: ab-spin 0.9s linear infinite;
      }
      @keyframes ab-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ailouros.theme");
          if (stored === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (_) {
          /* storage unavailable */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="ailouros-bootstrap" role="status" aria-live="polite">
      <div class="ab-logo" aria-hidden="true"></div>
      <div class="ab-title">AIlourOS</div>
      <div id="ailouros-bootstrap-message" class="ab-message">Starting…</div>
      <div class="ab-spinner" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
